name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # pnpm/action-setup's self-update cannot verify pnpm 11's Intel binary
      # against this project's lockfile. Install the pinned npm package directly.
      - name: Install pnpm on Intel macOS
        if: matrix.arch == 'x64'
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.arch == 'arm64'
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:check
      - run: node scripts/e2e-single-instance.mjs
      - run: node scripts/e2e-workspace-watcher.mjs
        if: matrix.arch == 'x64'
      - name: Package unsigned macOS app
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
