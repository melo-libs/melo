name: Bug report / 问题反馈
description: Report something that does not work as expected / 反馈不符合预期的行为
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 发生了什么？
      description: Describe the problem. Screenshots or a short recording are helpful.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open…
        2. Click…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Melo version / Melo 版本
      description: Find this in About Melo. For a development build, include the commit if known.
      placeholder: e.g. 2.1.3
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System / 系统
      placeholder: e.g. macOS 15, Apple silicon / Intel
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: For AI issues, include the tool and connection method. Remove API keys and private content from logs or screenshots.
